uid: SR-0034
type: system_requirement
status: approved
title: Suffix long literals with an uppercase L
text: >-
  Suffix a long-valued integer literal with an uppercase L, never a lowercase l, to avoid
  confusion with the digit one.
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: "Google Java Style Guide: Formatting — Specific Constructs — Numeric Literals"
