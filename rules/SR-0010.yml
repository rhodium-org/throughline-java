uid: SR-0010
type: system_requirement
status: approved
title: Order imports as static then non-static, ASCII-sorted
text: >-
  Order imports as a single group of static imports followed by a single group of
  non-static imports, separated by one blank line, with the names in ASCII sort order
  within each group.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "Google Java Style Guide: Source File Structure — Import Ordering"
