uid: SR-0052
type: system_requirement
status: approved
title: Order Javadoc block tags and never leave them empty
text: >-
  Order the standard Javadoc block tags as @param, @return, @throws, @deprecated; give
  none of them an empty description, and indent any continuation at least four spaces from
  the @.
links:
- target: UR-0008
  type: implements
