uid: SR-0028
type: system_requirement
status: proposed
title: Declare only one variable per declaration
text: Declare only one variable in each field or local variable declaration, except
  that multiple declarations are acceptable in a for-loop header.
normative: true
links:
- target: UR-0005
  type: implements
