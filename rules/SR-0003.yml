uid: SR-0003
type: system_requirement
status: approved
title: Use only the ASCII space and never tabs for whitespace
text: >-
  Use the ASCII horizontal space character (0x20) as the only whitespace character
  anywhere in a source file, and never use tab characters for indentation.
links:
- target: UR-0001
  type: implements
attrs:
