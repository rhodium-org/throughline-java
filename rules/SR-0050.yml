uid: SR-0050
type: system_requirement
status: approved
title: Use the correct Javadoc block form
text: >-
  Use the multi-line Javadoc form with aligned leading asterisks, or the single-line form
  when the whole comment fits on one line; do not use the single-line form when a block
  tag such as @param is present.
links:
