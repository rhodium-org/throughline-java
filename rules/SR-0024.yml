uid: SR-0024
type: system_requirement
status: approved
title: Use single ASCII spaces for horizontal separation
text: >-
  Use a single ASCII space after a keyword before a parenthesis, before an opening brace,
  around binary and ternary operators, after a comma, semicolon or the closing parenthesis
  of a cast, on both sides of a double-slash comment, and between a type and its
  identifier.
links:
