uid: SR-0040
type: system_requirement
status: approved
title: Name constants in UPPER_SNAKE_CASE
text: >-
  Name constants — static final fields that are deeply immutable and whose methods have no
  detectable side effects — in UPPER_SNAKE_CASE with words separated by single
  underscores.
links:
